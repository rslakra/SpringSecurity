name: SpringSecurity - SpringOauthClients CI

env:
  JAVA_VERSION: "21"
  DISTRIBUTION: "temurin"

on:
  push:
    paths:
      - "spring-oauth-clients/**"
      - ".github/workflows/spring-security-oauth-clients-ci.yml"
  pull_request:
    paths:
      - "spring-oauth-clients/**"
      - ".github/workflows/spring-security-oauth-clients-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - spring-oauth-clients/springboot-oauth-client
          - spring-oauth-clients/springboot-oauth2-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Build and run unit tests
        working-directory: ${{ matrix.module }}
        run: mvn -B -ntp test
